<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080E1A"><title>FitCoach 3.0 Definitive</title></head><body style="margin:0;background:#080E1A;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif"><div id="fcBoot" style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center"><div><h1>FitCoach</h1><p>Iniciando FitCoach 3.0 Definitive…</p></div></div><script>
(async()=>{try{
  if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}
  if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}
  const res=await fetch('./index.html?base=3.0&t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('No se pudo cargar la base de FitCoach');let html=await res.text();
  html=html.replaceAll('2.2.0','3.0.0').replaceAll('FitCoach 2.2','FitCoach 3.0');
  const shim='<script>window.CROSS_WODS=[];window.FITCOACH_DEFINITIVE={version:"3.0.0",crossCoachDetached:true};<\\/script>';
  const appTag=/<script\s+src=["']app\.js(?:\?v=[^"']+)?["']><\/script>/i;
  if(appTag.test(html))html=html.replace(appTag,shim+'<script src="app.js?fc=3.0&t='+Date.now()+'"><\\/script>');else html=html.replace('</body>',shim+'<script src="app.js?fc=3.0&t='+Date.now()+'"><\\/script></body>');
  html=html.replace('</head>','<link rel="stylesheet" href="fitcoach-definitive.css?v=3.0.0"></head>');
  html=html.replace('</body>','<script src="fitcoach-definitive.js?v=3.0.0&t='+Date.now()+'"><\\/script></body>');
  document.open();document.write(html);document.close();
}catch(e){document.getElementById('fcBoot').innerHTML='<div><h1>Error de inicio</h1><p>'+String(e&&e.message||e)+'</p><button onclick="location.reload()">Reintentar</button></div>'}})();
</script></body></html>
