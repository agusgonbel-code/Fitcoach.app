name: FitCoach Next CI

on:
  push:
    branches: [fitcoach-next]
    paths:
      - 'next/**'
      - '.github/workflows/fitcoach-next-ci.yml'
  pull_request:
    paths:
      - 'next/**'
      - '.github/workflows/fitcoach-next-ci.yml'

permissions:
  contents: write

jobs:
  test-next:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - name: Commit resolved RC lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/fitcoach-next'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'FitCoach Next CI'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build(next): commit reproducible package lock [skip ci]'
          git push origin HEAD:fitcoach-next
      - name: Capture resolved RC lockfile
        uses: actions/upload-artifact@v4
        with:
          name: fitcoach-next-package-lock
          path: next/package-lock.json
          if-no-files-found: error
          retention-days: 3
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: npm run test:mobile
