name: FitCoach Next CI

on:
  push:
    branches: [fitcoach-next]
    paths:
      - 'next/**'
      - '.github/workflows/fitcoach-next-ci.yml'
  pull_request:
    paths:
      - 'next/**'
      - '.github/workflows/fitcoach-next-ci.yml'

jobs:
  test-next:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - name: Capture resolved RC lockfile
        uses: actions/upload-artifact@v4
        with:
          name: fitcoach-next-package-lock
          path: next/package-lock.json
          if-no-files-found: error
          retention-days: 3
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: npm run test:mobile
