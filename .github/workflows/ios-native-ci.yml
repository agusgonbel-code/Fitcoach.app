name: FitCoach iOS Native CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'support.html'
      - 'PrivacyInfo.xcprivacy'
      - 'app-store/**'
      - 'version.json'
      - '*.js'
      - '*.css'
      - '*.png'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-native-ci.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'support.html'
      - 'PrivacyInfo.xcprivacy'
      - 'app-store/**'
      - 'version.json'
      - '*.js'
      - '*.css'
      - '*.png'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-native-ci.yml'

permissions:
  contents: read

concurrency:
  group: fitcoach-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK_VERSION"
          test "${SDK_VERSION%%.*}" -ge 26
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete test suite
        run: npm test
      - name: Audit and build bundled web assets
        run: |
          npm run audit
          npm run sync:web
      - name: Generate native iOS project
        run: npx cap add ios
      - name: Install FitCoach native assets and privacy manifest
        run: npm run ios:assets
      - name: Validate Capacitor configuration
        run: npx cap doctor ios
      - name: Compile for iOS Simulator without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Validate application identity, release and privacy
        id: app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Build/Products/Debug-iphonesimulator/App.app' -print -quit)"
          test -n "$APP_PATH"
          PLIST="$APP_PATH/Info.plist"
          PRIVACY="$APP_PATH/PrivacyInfo.xcprivacy"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          EXPECTED_VERSION="$(node -p "require('./app-store/release.json').marketingVersion")"
          EXPECTED_BUILD="$(node -p "require('./app-store/release.json').buildNumber")"
          test "$BUNDLE_ID" = 'com.fitcoach.app'
          test "$DISPLAY_NAME" = 'FitCoach'
          test "$VERSION" = "$EXPECTED_VERSION"
          test "$BUILD" = "$EXPECTED_BUILD"
          test -f "$APP_PATH/public/privacy.html"
          test -f "$APP_PATH/public/support.html"
          test -f "$PRIVACY"
          plutil -lint "$PRIVACY"
          test "$(plutil -extract NSPrivacyTracking raw -o - "$PRIVACY")" = 'false'
          test "$(plutil -extract NSPrivacyCollectedDataTypes json -o - "$PRIVACY")" = '[]'
          echo "Bundle ID: $BUNDLE_ID"
          echo "Display name: $DISPLAY_NAME"
          echo "Release: $VERSION ($BUILD)"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
      - name: Stage simulator artifact
        shell: bash
        run: |
          mkdir artifact
          cp -R "${{ steps.app.outputs.path }}" artifact/FitCoach.app
      - name: Upload simulator application
        uses: actions/upload-artifact@v4
        with:
          name: FitCoach-iOS-Simulator-${{ github.sha }}
          path: artifact/FitCoach.app
          if-no-files-found: error
          retention-days: 14
