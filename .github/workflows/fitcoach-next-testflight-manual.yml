name: FitCoach Next TestFlight Manual

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitcoach-next-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-testflight:
    if: github.ref_name == 'fitcoach-next'
    runs-on: macos-26
    timeout-minutes: 35
    environment: fitcoach-next-testflight
    defaults:
      run:
        working-directory: next
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      FITCOACH_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout exact development ref
        uses: actions/checkout@v4
        with:
          ref: fitcoach-next
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Regress RC release contracts
        run: npm run test:release

      - name: Run TestFlight signed preflight
        run: npm run release:testflight:preflight:signed

      - name: Require distribution signing material
        shell: bash
        run: |
          set -euo pipefail
          for name in IOS_DISTRIBUTION_CERTIFICATE_P12 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE; do
            value="${!name:-}"
            if [ -z "${value// }" ]; then
              echo "Missing required distribution signing input: $name" >&2
              exit 1
            fi
          done

      - name: Generate isolated iOS project
        run: npx cap add ios

      - name: Prepare native iOS Release project
        run: npm run ios:prepare

      - name: Install distribution certificate and provisioning profile
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/fitcoach-next-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/fitcoach-next-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/fitcoach-next.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/fitcoach-next-profile.plist"
          INSTALLED_PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12" | base64 -D > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 -D > "$PROFILE_PATH"
          test -s "$CERT_PATH"
          test -s "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution'

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          plutil -lint "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          APP_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          test "$PROFILE_TEAM" = "$APPLE_TEAM_ID"
          test "$APP_IDENTIFIER" = "$APPLE_TEAM_ID.com.fitcoach.next"

          mkdir -p "$INSTALLED_PROFILE_DIR"
          cp "$PROFILE_PATH" "$INSTALLED_PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Archive signed FitCoach Next Release for iPhone
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FitCoach-Next-Signed.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile_name }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.signing.outputs.keychain_path }}" \
            archive

      - name: Export signed IPA without uploading
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_DIR="$RUNNER_TEMP/fitcoach-next-export"
          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.fitcoach.next</key>
              <string>${{ steps.signing.outputs.profile_name }}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$EXPORT_OPTIONS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FitCoach-Next-Signed.xcarchive" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS"
          IPA_PATH="$(find "$EXPORT_DIR" -maxdepth 1 -name '*.ipa' -type f | head -1)"
          test -n "$IPA_PATH"
          test -s "$IPA_PATH"
          cp "$IPA_PATH" "$RUNNER_TEMP/FitCoach-Next.ipa"

      - name: Validate signed IPA contract
        shell: bash
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/FitCoach-Next.ipa"
          VERIFY_DIR="$RUNNER_TEMP/fitcoach-next-ipa-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA" -d "$VERIFY_DIR"
          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -name '*.app' -type d | head -1)"
          test -d "$APP_PATH"
          PLIST="$APP_PATH/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")"
          BINARY="$APP_PATH/$EXECUTABLE"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          EXPECTED_VERSION="$(node -p "require('./package.json').version.replace(/-.*/, '')")"
          ARCHS="$(lipo -archs "$BINARY")"
          test "$BUNDLE_ID" = 'com.fitcoach.next'
          test "$VERSION" = "$EXPECTED_VERSION"
          test "$BUILD" = "$FITCOACH_BUILD_NUMBER"
          echo "$ARCHS" | tr ' ' '\n' | grep -qx 'arm64'
          if echo "$ARCHS" | tr ' ' '\n' | grep -Eq '^(x86_64|i386)$'; then
            echo "Simulator architecture found in signed IPA: $ARCHS" >&2
            exit 1
          fi
          test -f "$APP_PATH/embedded.mobileprovision"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          test -f "$APP_PATH/public/index.html"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -q "TeamIdentifier=$APPLE_TEAM_ID"
          echo "Signed IPA validated: $BUNDLE_ID $VERSION ($BUILD), architectures: $ARCHS"

      - name: Stage signed candidate and readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p testflight-candidate
          cp "$RUNNER_TEMP/FitCoach-Next.ipa" testflight-candidate/FitCoach-Next.ipa
          shasum -a 256 testflight-candidate/FitCoach-Next.ipa > testflight-candidate/SHA256SUMS.txt
          shasum -a 256 -c testflight-candidate/SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "workflow_run=${GITHUB_RUN_NUMBER}"
            echo "bundle_id=com.fitcoach.next"
            echo "version=$(node -p \"require('./package.json').version.replace(/-.*/, '')\")"
            echo "build=${FITCOACH_BUILD_NUMBER}"
            echo "platform=iphoneos"
            echo "architecture=arm64"
            echo "distribution_gate=manual"
            echo "signed_preflight=passed"
            echo "signed_archive=passed"
            echo "signed_ipa=passed"
            echo "upload_performed=false"
          } > testflight-candidate/TESTFLIGHT-CANDIDATE-EVIDENCE.txt
          test -s testflight-candidate/TESTFLIGHT-CANDIDATE-EVIDENCE.txt

      - name: Upload signed TestFlight candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitCoach-Next-TestFlight-Candidate-${{ github.sha }}
          path: next/testflight-candidate/
          if-no-files-found: error
          retention-days: 14
